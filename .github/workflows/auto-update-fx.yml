name: Auto-actualizar FX diario

on:
  schedule:
    - cron: '0 18 * * 1-5'   # 18:00 UTC = 15:00 AR: actualiza SIOPEL (criptoya/MAE)
  workflow_dispatch:
    inputs:
      fecha:
        description: 'Fecha YYYY-MM-DD (vacío = hoy AR)'
        required: false
        default: ''
      valor_manual:
        description: 'Valor FX manual (omitir para usar criptoya.com)'
        required: false
        default: ''

jobs:
  update-fx:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar update
        env:
          INPUT_FECHA: ${{ github.event.inputs.fecha }}
          INPUT_VALOR: ${{ github.event.inputs.valor_manual }}
          MAE_API_KEY: ${{ secrets.MAE_API_KEY }}
        run: python3 scripts/run_workflow.py

      # Automatizacion de futuros ROFEX: DADA DE BAJA (30-jul-2026).
      # Se probaron 3 fuentes sin exito:
      #   - MAE: no tiene datos de futuros DLR (API devolvia [] siempre)
      #   - Primary/reMarkets: resulto ser un ambiente de simulacion, no datos reales
      #   - IOL (invertirOnline): la cuenta del usuario no tiene acceso a cotizaciones de futuros
      # scripts/update_futuros.py queda en el repo (con el intento de IOL) por si en el futuro
      # se consigue una fuente de datos real. Mientras tanto, el cierre de futuros se actualiza
      # a mano (Claude lo carga cuando el usuario pasa el dato del dia).

      - name: Commit y push
        run: |
          git config user.name "fx-bot[auto]"
          git config user.email "fx-bot@seguimiento-fx.local"
          git add index.html futurosHistorico.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Sin cambios — ya actualizado o no hubo rueda hoy."
          else
            git commit -m "auto: FX $(TZ='America/Argentina/Buenos_Aires' date +%Y-%m-%d) (SIOPEL criptoya.com)"
            git push
          fi
