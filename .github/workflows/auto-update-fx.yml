name: Auto-actualizar FX diario

on:
  schedule:
    - cron: '0 18 * * 1-5'   # 18:00 UTC = 15:00 AR: actualiza SIOPEL (criptoya/MAE)
    - cron: '0 21 * * 1-5'   # 21:00 UTC = 18:00 AR: actualiza futuros ROFEX (post-cierre 17hs, ya con ajuste oficial)
  workflow_dispatch:
    inputs:
      fecha:
        description: 'Fecha YYYY-MM-DD (vacío = hoy AR)'
        required: false
        default: ''
      valor_manual:
        description: 'Valor FX manual (omitir para usar criptoya.com)'
        required: false
        default: ''

jobs:
  update-fx:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar update
        env:
          INPUT_FECHA: ${{ github.event.inputs.fecha }}
          INPUT_VALOR: ${{ github.event.inputs.valor_manual }}
          MAE_API_KEY: ${{ secrets.MAE_API_KEY }}
        run: python3 scripts/run_workflow.py

      - name: Actualizar futuros ROFEX
        continue-on-error: true
        env:
          PRIMARY_USER: ${{ secrets.PRIMARY_USER }}
          PRIMARY_PASS: ${{ secrets.PRIMARY_PASS }}
          INPUT_FECHA: ${{ github.event.inputs.fecha }}
        run: |
          FECHA="${INPUT_FECHA}"
          if [ -z "$FECHA" ]; then
            FECHA=$(TZ='America/Argentina/Buenos_Aires' date +%Y-%m-%d)
          fi
          python3 scripts/update_futuros.py "$FECHA"

      - name: Commit y push
        run: |
          git config user.name "fx-bot[auto]"
          git config user.email "fx-bot@seguimiento-fx.local"
          git add index.html futurosHistorico.json scripts/futuros_debug.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Sin cambios — ya actualizado o no hubo rueda hoy."
          else
            git commit -m "auto: FX $(TZ='America/Argentina/Buenos_Aires' date +%Y-%m-%d) (SIOPEL criptoya.com + futuros Primary)"
            git push
          fi
